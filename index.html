<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭小金庫</title>
<!-- 手機桌面圖示 -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家庭小金庫">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff9eb5">
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg: #fff6f0; --text: #5b4650; --sub: #a48e98; --brand: #ff7a9c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #231c24; --text: #f7e9ef; --sub: #c4a9b6; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; padding: 24px 16px; text-align: center; }
  .box { max-width: 380px; width: 100%; }
  img { width: 140px; height: 140px; border-radius: 32px; box-shadow: 0 10px 30px rgba(255, 122, 156, .3); }
  h1 { font-size: 24px; margin: 18px 0 6px; }
  p { color: var(--sub); line-height: 1.7; margin: 6px 0; }
  a.go { display: block; margin: 22px 0 18px; padding: 15px; border-radius: 18px; color: #fff; text-decoration: none; font-weight: 700; font-size: 17px;
    background: linear-gradient(135deg, #ff9eb5, #ffc39e); }
  .tip { text-align: left; background: rgba(255, 122, 156, .1); border-radius: 16px; padding: 12px 16px; font-size: 14px; line-height: 1.8; }
</style>
</head>
<body>
<div class="box">
  <img src="icon-180.png" alt="家庭小金庫">
  <h1>家庭小金庫</h1>
  <p id="msg">正在打開…</p>
  <a class="go" id="go" href="https://script.google.com/macros/s/AKfycbyG_e5STqni62e82v3FUpfsBzHYbwvWslj4M_fX-1RvBkK_JTK48ChDInX3R8CpMJ2ZHg/exec">打開家庭小金庫</a>
  <div class="tip" id="tip">
    <b>加到手機桌面：</b><br>
    iPhone：按下方「分享」→「加入主畫面」<br>
    Android：按右上角 ⋮ →「加到主畫面」
  </div>
</div>
<script>
  // 從桌面圖示打開時（全螢幕模式）直接跳到 App；用瀏覽器打開時先停在這頁，方便加到主畫面
  const fromHome = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const msg = document.getElementById('msg');
  if (fromHome) {
    document.getElementById('tip').style.display = 'none';
    location.replace(document.getElementById('go').href);
  } else {
    msg.textContent = '按下面的按鈕打開，或先把這頁加到手機桌面';
  }
</script>
</body>
</html>
